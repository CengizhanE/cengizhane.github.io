        :root {
            --bg-color: #1a1b1e;       /* Deep Slate Grey (Like CAD software) */

            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* Links */
        a {
            color: var(--accent);
            text-decoration: none;
        }

        }
